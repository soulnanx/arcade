<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste - Sistema de Estrelas</title>
</head>
<body>
  <h1>Teste de Sistema de Estrelas e Pontuação</h1>
  
  <div id="results"></div>

  <script>
    // Mock do localStorage para teste
    global.localStorage = {
      store: {},
      getItem(key) {
        return this.store[key] || null;
      },
      setItem(key, value) {
        this.store[key] = value;
      },
      removeItem(key) {
        delete this.store[key];
      }
    };
  </script>
  <script src="storage.js"></script>
  <script>
    const results = document.getElementById('results');
    
    function test(name, condition) {
      const div = document.createElement('div');
      div.textContent = (condition ? '✅ PASSOU' : '❌ FALHOU') + ' - ' + name;
      div.style.color = condition ? 'green' : 'red';
      results.appendChild(div);
    }

    // Teste 1: Inicialização
    test('ProgressManager inicializa corretamente', !!progressManager);

    // Teste 2: Salvar progresso
    progressManager.saveLevelProgress(1, 3, 10, 10);
    const level1 = progressManager.getLevelProgress(1);
    test('Salvar progresso de fase funciona', level1.completed && level1.stars === 3);

    // Teste 3: Melhoramento de stars
    progressManager.saveLevelProgress(1, 2, 15, 10);
    const level1Updated = progressManager.getLevelProgress(1);
    test('Manter melhor resultado (stars)', level1Updated.stars === 3);

    // Teste 4: Stats globais
    const stats = progressManager.getGlobalStats();
    test('Stats globais calculados', stats.totalStars === 3 && stats.gamesCompleted === 1);

    // Teste 5: Reset de fase
    progressManager.resetLevelProgress(1);
    const level1Reset = progressManager.getLevelProgress(1);
    test('Reset de fase funciona', !level1Reset.completed);

    // Teste 6: Achievements
    progressManager.saveLevelProgress(1, 3, 10, 10);
    progressManager.saveLevelProgress(2, 3, 10, 10);
    const statsWithAch = progressManager.getGlobalStats();
    test('Achievements registrados', statsWithAch.achievements.includes('first_win'));

    // Resumo
    const summary = document.createElement('div');
    summary.innerHTML = '<br><strong>Resumo:</strong><br>' + 
      'Total de stars: ' + statsWithAch.totalStars + '<br>' +
      'Games completados: ' + statsWithAch.gamesCompleted + '<br>' +
      'Achievements: ' + statsWithAch.achievements.join(', ');
    results.appendChild(summary);
  </script>
</body>
</html>
